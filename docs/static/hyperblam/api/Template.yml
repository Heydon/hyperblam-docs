name: Template
category: Visualizing
extends: Handle
draft: true
props: 
  - name: additive
    type: boolean
    default: false
    description: Whether to log cumulatively or to just log the most recent data.
  - name: max
    type: number
    default: 16
    description: The number of times data is logged before clearing the `to` element and starting over. Stops the DOM getting too unwieldy.
  - name: prop 
    description: Not applicable.
  - name: places
    type: number 
    default: 1
    description: For numeric data, the number of (fixed) decimal places. Set to `3`, `1` will become `1.000`. 
  - name: to 
    type: string
    default: 'null' 
    description: A selector for the element to which templated data will be appended. If not set (`null`), it defaults to the **Template**-based element itself.