name: Frame
extends: BandsToProps
category: Visualizing
summary: A primitive for Shadow DOM-based `<analyser-blam>` visualisation using CSS custom properties and transitions.
props:
  - name: count
    type: number
    default: 16
    description: The number of elements to render, mapping to data bands. If there are more elements than bands (taken from `<analyser-blam>` `bands`) then the pattern repeats.