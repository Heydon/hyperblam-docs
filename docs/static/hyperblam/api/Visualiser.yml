name: Visualiser
extends: Base
category: Visualizing
summary: Base element for translating **Analyser** data. Data is namespaced by taking the element’s id, taking the **Analyser’s** `id`, or generating a random 4 character string, in that order of priority.
props:
  - name: analyser
    type: string
    description: A CSS selector for the **Analyser** element. Defaults to the first **Analyser** found in the page.
  - name: fps
    type: number 
    default: 25
    description: Frames per second. The frequency with which **Analyser** data is read.
methods:
  - name: start 
    description: Starts taking data from the associated `analyser`.
  - name: stop 
    description: Changes into a non-running state. Frequency data is still taken from the `analyser` until frequency values all become `0`. This allows for the audio tail to be visualized.
  - name: startStop
    description: Toggles between `start` and `stop`.