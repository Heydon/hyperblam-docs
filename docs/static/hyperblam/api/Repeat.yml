name: Repeat 
extends: Base 
category: Sequencing
defined: true 
summary: Group some `<track-blam>` element’s `<bar-blam>`s and repeat the enclosed pattern/part `x` number of times.
props: 
  - name: x
    type: number
    default: 1
    description: How many times the enclosed pattern/part should be repeated. If `x="3"`, the `<bar-blam>` or `<bar-blam>`s will play 3 times before the next `<bar-blam>` or `<repeat-blam>` element is played.